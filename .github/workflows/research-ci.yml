name: Research reproducibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  screening:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments/SL-E001/bounds.py

      - run: python experiments/SL-E002/audit.py

      - run: python experiments/SL-E003/link.py

      - run: python experiments/SL-E004/screen.py
      - if: matrix.python == '3.11'
        run: python experiments/SL-E004/probe_source.py

      - run: python experiments/SL-E005/screen.py

      - run: python experiments/SL-E006/solar.py
      - run: python experiments/SL-E007/optical.py

      - run: python experiments/SL-E008/coherence.py
      - run: python experiments/SL-E009/optical.py

      - run: python experiments/SL-E011/count.py
      - run: python experiments/SL-E012/solar_diffraction.py
      - run: python experiments/SL-E013/ambient.py

      - run: python experiments/SL-E014/receiver.py
      - run: python experiments/SL-E015/scatter.py
      - run: python experiments/SL-E016/relay.py

      - run: python experiments/SL-E017/inverse.py

      - run: python experiments/SL-E018/echo.py

      - run: python experiments/SL-E019/natural.py
